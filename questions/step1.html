<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body>

    <!-- Header -->

        <div class="container">

            <div class="mb-4">

                    <a href="" class="back-link">

                    </a>

            <div class="bg-white rounded-4 overflow-hidden shadow-sm">

                    <!-- Sidebar -->
                    <div class="col-lg-3">

                        <div class="h-100 p-4" style="background:#EEF5FD;">

                            <!-- Step 1 -->
                            <div class="step-item active">
                                <img src="../img/check_circle.svg" width="24" alt="">
                                <span>Ready for change</span>
                            </div>
                            <div class="step-line"></div>

                            <!-- Step 2 -->
                            <div class="step-item">
                                <img src="../img/check_circle (1).svg" width="24" alt="">

                            <div class="step-line"></div>

                            <div class="step-item">

                            <div class="step-item">
                                <img src="../img/check_circle (1).svg" width="24" alt="">

                            <div class="step-line"></div>

                            <!-- Step 5 -->
                            <div class="step-item">
                                <img src="../img/check_circle (1).svg" width="24" alt="">

                            </div>
                            <div class="step-line"></div>

                            <!-- Step 6 -->
                            <div class="step-item">
                                <img src="../img/check_circle (1).svg" width="24" alt="">
                                <span>Referral</span>
                            </div>

                        </div>

                    </div>

                    <div class="col-lg-9">

                            <div class="d-flex justify-content-between small fw-semibold mb-2">
                                <span>Step 1 to 6</span>

                            </div>

                            <div class="progress mb-5" style="height:3px;">
                                <div class="progress-bar" style="width:20%; background:#3150A0;">

                            </div>

                            <div class="text-center py-lg-5">

                                    <button class="btn rounded-pill px-5"
