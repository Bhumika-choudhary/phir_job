<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Confirmation</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- AOS -->
    <link rel="stylesheet"
        href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <link rel="stylesheet" href="./step7.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="fixed-header bg-white py-3 border-bottom">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12">
                    <img src="../img/Group 134.png" alt="Logo" class="img-fluid">
                </div>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-grow-1 py-4" style="background:#F7F5FA;">

        <div class="container">

            
          

            <!-- Center Card -->
            <div class="row justify-content-center align-items-center" style="min-height:70vh; width:100%;">

                <div class="col-lg-5 col-md-6 col-sm-8">

                    <div class="card border-0 rounded-4 shadow-sm p-4 text-center">

                        <h2 class="fw-bold mb-3">
                            Thank you for showing
                            interest in PHIR JOBS
                        </h2>

                        <p class="text-secondary small mb-4" style="font-size:18px; font-weight:300;">
                            You have been referred by XYZ,
                            location of XYZ kindly confirm.
                        </p>

                        <div class="d-flex gap-3">

                            <a href="#" class="btn btn-prev rounded-pill flex-fill">
                                No/नहीं
                            </a>

                            <a href="#" class="btn btn-next rounded-pill flex-fill">
                                Yes/हाँ
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">

                    <small class="text-muted">
                        © 2026 PHIR Jobs. All rights reserved. |
                        Built for the next generation of talent.
                    </small>

                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

</body>

</html>
