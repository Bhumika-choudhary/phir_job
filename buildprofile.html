<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your Profile</title>

    <!----------- link ----------->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/buildprofile.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!--------for animation------>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="bg-white py-3 border-bottom">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-6">
                    <img src="./img/Group 134.png" alt="Logo" class="img-fluid">
                </div>

                <div class="col-6 back-btn d-flex justify-content-end align-items-center">

                    <a href="register.html" class="back-link">
                        <i class="fa-solid fa-arrow-left me-2"></i>
                        Back
                    </a>

                </div>

            </div>
        </div>
    </header>

    <!-- Login Section -->




  <section class="profile-section py-5">

    <div class="container">

        <div class="row justify-content-center align-items-center g-4">

            <!-- Left Card -->
            <div class="col-12 col-lg-7"  data-aos="fade-right">

                <div class="profile-card bg-white rounded-4">

                    <!-- Header -->
                    <div class="profile-header d-flex justify-content-between align-items-center flex-wrap gap-3 p-4 border-bottom">

                        <div>
                            <h2 class="main-title mb-2">
                                We’re building your profile
                            </h2>

                            <p class="sub-text mb-0">
                                We’re extracting details from your resume to speed things up.
                            </p>
                        </div>

                        <div class="d-flex align-items-center gap-3">

                            <div class="loader-wrapper">
                                <div class="custom-loader"></div>
                            </div>

                            <span class="status-text">
                                10 Sec
                            </span>

                        </div>

                    </div>

                    <!-- Timeline -->
                    <div class="timeline p-4">

                        <div class="timeline-item active">
                            <div class="timeline-icon">
                                <i class="bi bi-check"></i>
                            </div>

                            <div class="timeline-content">
                                Personal Information
                            </div>
                        </div>

                        <div class="timeline-item active">
                            <div class="timeline-icon">
                                <i class="bi bi-check"></i>
                            </div>

                            <div class="timeline-content">
                                Education
                            </div>
                        </div>

                        <div class="timeline-item active">
                            <div class="timeline-icon">
                                <i class="bi bi-check"></i>
                            </div>

                            <div class="timeline-content">
                                Skills + Work Experience
                            </div>
                        </div>

                        <div class="timeline-item active">
                            <div class="timeline-icon">
                                <i class="bi bi-check"></i>
                            </div>

                            <div class="timeline-content">
                                Job Preferences
                            </div>
                        </div>

                        <div class="timeline-item">

                            <div class="timeline-icon"></div>

                            <div class="timeline-content inactive">
                                Final View
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Right Image -->
            <div class="col-12 col-lg-5"  data-aos="fade-left">

                <img src="./img/login img.png"
                    alt="Profile Image"
                    class="img-fluid w-100 profile-image rounded-4">

            </div>

        </div>

    </div>

</section>




    <!-- Footer -->
<footer class="bg-white py-3 mt-4">

    <div class="container">

        <div class="row align-items-center">

            <div class="col-12 col-lg-8 text-center text-lg-start">

                <p class="mb-0">
                    © 2026 PHIR Jobs. All rights reserved. |
                    Built for the next generation of talent.
                </p>

            </div>

            <div class="col-12 col-lg-4 mt-2 mt-lg-0">

                <div class="d-flex justify-content-center justify-content-lg-end align-items-center gap-2">

                    <img src="./img/shield_lock.svg"
                        alt=""
                        width="20"
                        height="20">

                    <span class="text-success">
                        Your Data is Safe & Secure
                    </span>

                </div>

            </div>

        </div>

    </div>

</footer>


    <!-- script for animation -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

    <script src="./script/buildprofile.js"></script>


</body>

</html>
