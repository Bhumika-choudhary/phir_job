<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHIR Jobs Registration</title>

    <!----------- link ----------->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!--------for animation------>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="bg-white py-3 border-bottom">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-6">
                    <img src="./img/Group 134.png" alt="Logo" class="img-fluid">
                </div>

                <div class="col-6 register d-flex justify-content-end align-items-center gap-3">
                    <small class=" content">Don't have an account?</small>

                    <a href="register.html" class="btn">
                        Login
                    </a>
                </div>

            </div>
        </div>
    </header>

    <!-- Login Section -->
    <section class="login-section py-5">
        <div class="container">

            <div class="row justify-content-center align-items-center g-4">

                <!-- Login Form -->
                <div class="col-12 col-lg-7" data-aos="fade-right">

                    <div class="login-card  rounded-4 p-4 p-md-5 ">

                        <h2 class="fw-bold mb-5">
                            Register to <br>
                            PHIR JOBS
                        </h2>

                        <form>

                            <div class="row form-content g-3 mb-3 ">

                                <!-- Email -->
                                <div class="col-12 col-md-6">
                                    <label class="form-label ">
                                        Full Name *
                                    </label>

                                    <input type="text" class="form-control" placeholder="aditi mishra">
                                </div>

                                <!-- Password -->
                                <div class="col-12 col-md-6">


                                    <div class="position-relative">

                                        <label class="form-label ">
                                            Email *
                                        </label>

                                        <input type="text" class="form-control" placeholder="aditi@info.gmail.com">



                                    </div>
                                </div>

                            </div>
                            <div class="row form-content g-3">

                                <!-- Email -->
                                <div class="col-12 col-md-6">
                                    <label class="form-label">
                                        Password
                                    </label>

                                    <input type="password" class="form-control pe-2" placeholder="********">
                                </div>

                                <!-- Password -->
                                <div class="col-12 col-md-6">
                                    <label class="form-label">
                                        Confirm Password
                                    </label>

                                    <div class="position-relative">

                                        <input type="password" class="form-control pe-2" placeholder="********">


                                    </div>
                                </div>

                            </div>


                            <!-- Sign In Button -->
                            <div class=" submit d-grid mt-4">
                                <button class="btn  rounded-pill">
                                    <a href=""> Register</a>
                                </button>
                            </div>

                            <!-- Divider -->
                            <div class="position-relative text-center my-4">

                                <hr>

                                <span class="or-text">
                                    OR
                                </span>

                            </div>

                            <!-- Google Button -->
                            <button type="button"
                                class="btn google-btn w-100 rounded-pill d-flex align-items-center justify-content-center gap-2">

                                <img src="./img/search 1.svg" alt="Google" width="20">

                                Google

                            </button>

                        </form>

                    </div>

                </div>

                <!-- Right Image -->
                <div class="col-12 col-lg-5" data-aos="fade-left">

                    <img src="./img/login img.png" alt="Login" class="img-fluid w-100 login-image rounded-4">

                </div>

            </div>

        </div>
    </section>
    <!-- Footer -->

    <footer>
        <div class="row ">
            <div class="col-12 footer-content">

                <P>
                    © 2026 PHIR Jobs. All rights reserved. |
                    Built for the next generation of talent.
                </P>

            </div>
        </div>
    </footer>



    <!-- script for animation -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

    <script src="./script/script.js"></script>


</body>

</html>
