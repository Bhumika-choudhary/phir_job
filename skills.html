<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills And Experience</title>

    <!----------- link ----------->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <link rel="stylesheet" href="./style/skills.css">


    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!--------for animation------>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="bg-white py-3 border-bottom">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-6">
                    <img src="./img/Group 134.png" alt="Logo" class="img-fluid">
                </div>

                <div class="col-6 back-btn d-flex justify-content-end align-items-center">

                    <a href="information.html" class="back-link">
                        <i class="fa-solid fa-arrow-left me-2"></i>
                        Back
                    </a>

                </div>

            </div>
        </div>
    </header>

    <!-- information  Section -->


    <section class="py-5" style="background:#f6f4f9;">
        <div class="container">

            <div class="row justify-content-center align-items-start g-4">

                <!-- Left Form Card -->
                <div class="col-12 col-lg-7" data-aos="fade-right">

                    <div class="bg-white  rounded-4 overflow-hidden">

                        <!-- Header -->
                        <div class="d-flex justify-content-between align-items-center p-4 ">

                            <h3 class="fw-bold mb-0">
                                Skills + Work Experience
                            </h3>

                            <!-- STEP IMAGE -->
                            <div class="step-wrapper d-flex justify-content-center align-items-center">

                                <div class="step-circle">
                                    <div class="step-content">
                                        <span class="step-text">STEP</span>
                                        <p>2/4</p>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <!-- Body -->
                        <div class="p-4">

                            <!-- Skills -->
                            <h5 class="fw-bold mb-2">
                                Skills
                            </h5>

                            <small class=" d-block mb-3">
                                Enter your skills (Min 3 or Max 15)
                            </small>

                            <div class="skills-box">

                                <input type="text" id="skillInput" class="form-control custom-input"
                                    placeholder="Enter your skills ">

                                <div id="skillsContainer" class="d-flex flex-wrap gap-2 mt-3">
                                </div>

                            </div>



                            <!-- Experience -->
                            <h5 class="fw-bold mb-3">
                                Experience
                            </h5>

                            <div class="form-check custom-check mb-4">

                                <input class="form-check-input" type="checkbox" id="fresher">

                                <label class="form-check-label" for="fresher">
                                    I am Fresher
                                </label>

                            </div>

                            <div class="row g-4">

                                <!-- SCHOOL -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Qualification
                                    </label>

                                    <select class="form-select custom-input">
                                        <option>Select Qualification</option>
                                        <option>Diploma</option>
                                        <option>ITI</option>
                                        <option>Bachelor of Arts (BA)</option>
                                        <option>Bachelor of Science (BSc)</option>
                                        <option>Bachelor of Commerce (BCom)</option>
                                        <option>Bachelor of Technology (B.Tech)</option>
                                        <option>Bachelor of Engineering (BE)</option>
                                        <option>Bachelor of Computer Applications (BCA)</option>
                                        <option>Bachelor of Business Administration (BBA)</option>
                                        <option>Master of Arts (MA)</option>
                                        <option>Master of Science (MSc)</option>
                                        <option>Master of Commerce (MCom)</option>
                                        <option>Master of Technology (M.Tech)</option>
                                        <option>Master of Computer Applications (MCA)</option>
                                        <option>Master of Business Administration (MBA)</option>
                                        <option>PhD / Doctorate</option>
                                        <option>Other</option>
                                    </select>

                                </div>

                                <!-- DEGREE -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Degree Type
                                    </label>

                                    <select class="form-select custom-input">
                                        <option>Select Type</option>
                                        <option>High School</option>
                                        <option>Intermediate / 12th</option>
                                        <option>Diploma</option>
                                        <option>Associate Degree</option>
                                        <option>Bachelor's Degree</option>
                                        <option>Master's Degree</option>
                                        <option>Doctorate (PhD)</option>
                                        <option>Professional Degree</option>
                                        <option>Certificate Course</option>
                                        <option>ITI</option>
                                        <option>Other</option>


                                    </select>

                                </div>

                                <!-- START DATE -->
                                <div class="col-md-6">
                                    <label class="form-label custom-label">
                                        Start Date
                                    </label>

                                    <input type="date" class="form-control custom-input" name="start_date">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label custom-label">
                                        End Date (Expected)
                                    </label>

                                    <input type="date" class="form-control custom-input" name="end_date">
                                </div>

                            </div>

                            <!-- Bottom Actions -->
                            <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-3">

                                <div class="form-check custom-check">

                                    <input class="form-check-input" type="checkbox" id="working">

                                    <label class="form-check-label small" for="working">
                                        Currently working here
                                    </label>

                                </div>

                                <a href="#" class="add-more-link">
                                    + Add More
                                </a>

                            </div>

                            <div class="col-12 text-end">

                                <a href="preference.html" class="continue-btn text-decoration-none">
                                    Continue
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- Right Image -->
                <div class="col-12 col-lg-5" data-aos="fade-left">

                    <img src="./img/login img.png" alt="Profile Image" class="img-fluid w-100 profile-image rounded-4">

                </div>

            </div>

        </div>
    </section>





    <!-- Footer -->
    <footer class="bg-white py-3 mt-4">

        <div class="container">

            <div class="row d-flex align-items-center">

                <div class="col-12 col-lg-8 text-center text-lg-start">

                    <p class="mb-0">
                        © 2026 PHIR Jobs. All rights reserved. |
                        Built for the next generation of talent.
                    </p>

                </div>

                <div class="col-12 col-lg-4 mt-2 mt-lg-0">

                    <div class="d-flex justify-content-center justify-content-lg-end align-items-center gap-2">

                        <img src="./img/shield_lock.svg" alt="" width="20" height="20">

                        <span class="text-success">
                            Your Data is Safe & Secure
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </footer>


    <!-- script for animation -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

    <script src="script/skills.js"></script>



</body>

</html>
