<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Interview 1 </title>


    <!----------- link ----------->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="mock2.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!--------for animation------>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

</head>

<body>


    <!------------ choose template----------->




    <!---------- Quick action ------------->

    <section class="quick-actions-section">

        <div class="container">

            <div class="row align-items-center" data-aos="fade-up">

                <div class="d-flex gap-4">
                    <!-- Heading -->
                    <div class="col-auto ">
                        <h6 class="mb-0 fw-semibold quick-heading">
                            Quick Actions
                        </h6>
                    </div>

                    <!-- Divider -->
                    <div class="col-auto">
                        <div class="vr"></div>
                    </div>

                    <!-- Carousel -->


                    <div id="carouselExample" class="carousel slide">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">

                                    <a href="#" class="action-link">
                                        <img src="../img/business_center.svg" alt="">
                                        AI Resume Builder
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="../img/domain.svg" alt="">
                                        Assess Yourself
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="../img/frame_person_mic.svg" alt="">
                                        Mock Interview
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="../img/school.svg" alt="">
                                        Upskill Yourself
                                    </a>

                                </div>
                            </div>
                            <div class="carousel-item">
                                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">

                                    <a href="#" class="action-link">
                                        <img src="../img/adaptive_audio_mic.svg" alt="">
                                        Counselling
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="../img/adaptive_audio_mic.svg" alt="">
                                        Work
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="../img/adaptive_audio_mic.svg" alt="">
                                        Jobs
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="../img/adaptive_audio_mic.svg" alt="">
                                        Companies
                                    </a>

                                </div>

                            </div>

                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>

                </div>


            </div>

        </div>

    </section>

    <!---------- Quick action end ------------->


    <!------------- top company hiring ------------>


    <section class="py-4">
        <div class="container" style="max-width:950px;">

            <!-- Top Bar -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

                <a href="#" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </a>

                <div class="d-flex ">

                    <button class="next-btn rounded-pill px-4">
                        Next Step
                        <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>

                </div>

            </div>

            <h3 class="fw-bold mb-4">
                Mock Interview
            </h3>

            <div class="text-center mb-4">
                <h2 class="fw-bold mb-2">
                    Hi! I’m your interview coach.
                </h2>

                <p class="small ">
                    SLet’s personalize your session. What role are you targeting?
                </p>

                <!-- Role Tags -->
                <div class="d-flex flex-wrap gap-3 mb-5">

                    <button class="role-btn">
                        Software Engineer
                    </button>

                    <button class="role-btn">
                        Product Manager
                    </button>

                    <button class="role-btn">
                        Marketing Lead
                    </button>

                </div>

                <!-- Label -->
                <label class="form-label fw-medium mb-3">
                    Search or select your target role
                </label>

                <!-- Select -->
                <select class="form-select custom-select">

                    <option selected disabled>
                        Start typing a role...
                    </option>

                    <option>Software Engineer</option>
                    <option>Frontend Developer</option>
                    <option>Backend Developer</option>
                    <option>Full Stack Developer</option>
                    <option>UI/UX Designer</option>
                    <option>Graphic Designer</option>
                    <option>Product Manager</option>
                    <option>Project Manager</option>
                    <option>Business Analyst</option>
                    <option>Data Analyst</option>
                    <option>Data Scientist</option>
                    <option>Machine Learning Engineer</option>
                    <option>DevOps Engineer</option>
                    <option>QA Engineer</option>
                    <option>Cyber Security Analyst</option>
                    <option>Cloud Engineer</option>
                    <option>Marketing Lead</option>
                    <option>Digital Marketing Executive</option>
                    <option>SEO Specialist</option>
                    <option>Content Writer</option>
                    <option>Social Media Manager</option>
                    <option>Sales Executive</option>
                    <option>HR Executive</option>
                    <option>Recruiter</option>
                    <option>Technical Recruiter</option>
                    <option>Customer Support Executive</option>
                    <option>Financial Analyst</option>
                    <option>Accountant</option>
                    <option>Operations Manager</option>

                </select>


            </div>




        </div>
    </section>





    <!------------- top company hiring end ------------>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

    

</body>

</html>
