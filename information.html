<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>

    <!----------- link ----------->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <link rel="stylesheet" href="./style/information.css">


    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!--------for animation------>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="bg-white py-3 border-bottom">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-6">
                    <img src="./img/Group 134.png" alt="Logo" class="img-fluid">
                </div>

                <div class="col-6 back-btn d-flex justify-content-end align-items-center">

                    <a href="register.html" class="back-link">
                        <i class="fa-solid fa-arrow-left me-2"></i>
                        Back
                    </a>

                </div>

            </div>
        </div>
    </header>

    <!-- information  Section -->


    <section class="py-5 profile-section">

        <div class="container">

            <div class="row justify-content-center g-4">

                <!-- LEFT -->
                <div class="col-lg-7"  data-aos="fade-right">

                    <div class="profile-card rounded-4 p-lg-4 p-3 h-100" style="background-color: #f8f8f8;">

                        <!-- HEADER -->
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">

                            <div>

                                <h2 class="section-title mb-2 ">
                                    Personal Information
                                </h2>

                                <!-- <p class="section-subtitle mb-0">
                    Fill in your personal details to continue your profile setup.
                </p> -->

                            </div>

                            <!-- STEP IMAGE -->
                            <div class="step-wrapper d-flex justify-content-center align-items-center">

                                <div class="step-circle">
                                    <div class="step-content">
                                        <span class="step-text">STEP</span>
                                        <p>1/4</p>
                                    </div>
                                </div>

                            </div>

                        </div>

                        <!-- PERSONAL INFO BOX -->
                        <div class="info-box p-lg-4 p-3 border-bottom">

                            <div class="row g-4 mb-4">

                                <!-- NAME -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Full Name <span>*</span>
                                    </label>

                                    <input type="text" class="form-control custom-input" placeholder="Enter your name"
                                        value="Aditi Mishra">

                                </div>

                                <!-- LOCATION -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Current Location <span>*</span>
                                    </label>

                                    <select class="form-select custom-input">
                                        <option>Gurgaon</option>
                                        <option>Ahmedabad</option>
                                        <option>Mumbai</option>
                                        <option>Delhi</option>
                                        <option>Bengaluru</option>
                                        <option>Pune</option>
                                        <option>Hyderabad</option>
                                        <option>Chennai</option>
                                        <option>Kolkata</option>
                                        <option>Jaipur</option>
                                        <option>Surat</option>
                                        <option>Indore</option>
                                        <option>Gurgaon</option>
                                        <option>Noida</option>
                                        <option>Other</option>
                                    </select>

                                </div>

                                <!-- EMAIL -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Email Address <span>*</span>
                                    </label>

                                    <input type="email" class="form-control custom-input"
                                        placeholder="aditiedinfo@gmail.com">

                                </div>

                                <!-- PHONE -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Phone Number <span>*</span>
                                    </label>

                                    <div class="input-group ">

                                        <span class="input-group-text custom-input bg-white gap-2">
                                            <img src="./img/india 1.svg" alt="">
                                            +91
                                        </span>

                                        <input type="text" class="form-control custom-input" placeholder="88888 22222">

                                    </div>

                                </div>

                                <!-- GENDER -->
                                <div class="col-12">

                                    <label class="form-label custom-label">
                                        Gender
                                    </label>

                                    <div class="d-flex flex-wrap gap-2 gender-group">

                                        <input type="radio" class="btn-check" name="gender" id="male" checked>
                                        <label class="gender-btn" for="male">Male</label>

                                        <input type="radio" class="btn-check" name="gender" id="female">
                                        <label class="gender-btn" for="female">Female</label>

                                        <input type="radio" class="btn-check" name="gender" id="transgender">
                                        <label class="gender-btn" for="transgender">Transgender</label>

                                        <input type="radio" class="btn-check" name="gender" id="nonbinary">
                                        <label class="gender-btn" for="nonbinary">Non-Binary</label>

                                        <input type="radio" class="btn-check" name="gender" id="prefer-not">
                                        <label class="gender-btn" for="prefer-not">Prefer not to say</label>

                                    </div>

                                </div>

                                <!-- DOB -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Date of Birth
                                    </label>

                                    <input type="date" class="form-control custom-input" name="dob">

                                </div>

                                <!-- DISABILITY -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Disability
                                    </label>

                                    <select class="form-select custom-input">
                                        <option selected disabled>Select Disability</option>
                                        <option>No Disability</option>
                                        <option>Locomotor Disability</option>
                                        <option>Visual Impairment</option>
                                        <option>Hearing Impairment</option>
                                        <option>Speech and Language Disability</option>
                                        <option>Intellectual Disability</option>
                                        <option>Autism Spectrum Disorder</option>
                                        <option>Cerebral Palsy</option>
                                        <option>Multiple Disabilities</option>
                                        <option>Other</option>
                                    </select>

                                </div>

                            </div>

                        </div>

                        <!-- EDUCATION -->
                        <div class="education-wrapper mt-4 p-lg-4 p-3">

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">

                                <div>

                                    <h2 class="section-title mb-1">
                                        Education
                                    </h2>

                                </div>

                            </div>

                            <div class="row g-4">

                                <!-- SCHOOL -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Qualification
                                    </label>

                                    <select class="form-select custom-input">
                                        <option>Select Qualification</option>
                                        <option>Diploma</option>
                                        <option>ITI</option>
                                        <option>Bachelor of Arts (BA)</option>
                                        <option>Bachelor of Science (BSc)</option>
                                        <option>Bachelor of Commerce (BCom)</option>
                                        <option>Bachelor of Technology (B.Tech)</option>
                                        <option>Bachelor of Engineering (BE)</option>
                                        <option>Bachelor of Computer Applications (BCA)</option>
                                        <option>Bachelor of Business Administration (BBA)</option>
                                        <option>Master of Arts (MA)</option>
                                        <option>Master of Science (MSc)</option>
                                        <option>Master of Commerce (MCom)</option>
                                        <option>Master of Technology (M.Tech)</option>
                                        <option>Master of Computer Applications (MCA)</option>
                                        <option>Master of Business Administration (MBA)</option>
                                        <option>PhD / Doctorate</option>
                                        <option>Other</option>
                                    </select>

                                </div>

                                <!-- DEGREE -->
                                <div class="col-md-6">

                                    <label class="form-label custom-label">
                                        Degree Type
                                    </label>

                                    <select class="form-select custom-input">
                                        <option>Select Type</option>
                                        <option>High School</option>
                                        <option>Intermediate / 12th</option>
                                        <option>Diploma</option>
                                        <option>Associate Degree</option>
                                        <option>Bachelor's Degree</option>
                                        <option>Master's Degree</option>
                                        <option>Doctorate (PhD)</option>
                                        <option>Professional Degree</option>
                                        <option>Certificate Course</option>
                                        <option>ITI</option>
                                        <option>Other</option>


                                    </select>

                                </div>

                                <!-- START DATE -->
                                <div class="col-md-6">
                                    <label class="form-label custom-label">
                                        Start Date
                                    </label>

                                    <input type="date" class="form-control custom-input" name="start_date">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label custom-label">
                                        End Date (Expected)
                                    </label>

                                    <input type="date" class="form-control custom-input" name="end_date">
                                </div>

                            </div>

                            <!-- Bottom Actions -->

                            <!-- Add More Link -->

                            <div class="col-12 text-end mt-1">

                                <a href="#" class="add-more-link">
                                    + Add More
                                </a>

                            </div>

                            <!-- Continue Button -->

                            <div class="col-12 text-end">

                                <a href="skills.html" class="continue-btn text-decoration-none">
                                    Continue
                                </a>

                            </div>


                        </div>

                    </div>

                </div>

                <!-- RIGHT -->
                <div class="col-12 col-lg-5" data-aos="fade-left">

                    <img src="./img/login img.png" alt="Profile Image" class="img-fluid w-100 profile-image rounded-4">

                </div>

            </div>

        </div>

    </section>






    <!-- Footer -->
    <footer class="bg-white py-3 mt-4">

        <div class="container">

            <div class="row d-flex align-items-center">

                <div class="col-12 col-lg-8 text-center text-lg-start">

                    <p class="mb-0">
                        © 2026 PHIR Jobs. All rights reserved. |
                        Built for the next generation of talent.
                    </p>

                </div>

                <div class="col-12 col-lg-4 mt-2 mt-lg-0">

                    <div class="d-flex justify-content-center justify-content-lg-end align-items-center gap-2">

                        <img src="./img/shield_lock.svg" alt="" width="20" height="20">

                        <span class="text-success">
                            Your Data is Safe & Secure
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </footer>


    <!-- script for animation -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>




</body>

</html>
