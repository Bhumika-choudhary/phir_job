<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  Template </title>


    <!----------- link ----------->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/template.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!--------for animation------>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

</head>

<body>


    <!------------ choose template----------->




    <!---------- Quick action ------------->

    <section class="quick-actions-section" data-aos="fade-up">

        <div class="container">

            <div class="row align-items-center">

                <div class="d-flex gap-4">
                    <!-- Heading -->
                    <div class="col-auto ">
                        <h6 class="mb-0 fw-semibold quick-heading">
                            Quick Actions
                        </h6>
                    </div>

                    <!-- Divider -->
                    <div class="col-auto">
                        <div class="vr"></div>
                    </div>

                    <!-- Carousel -->


                    <div id="carouselExample" class="carousel slide">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">

                                    <a href="#" class="action-link">
                                        <img src="./img/business_center.svg" alt="">
                                        AI Resume Builder
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="./img/domain.svg" alt="">
                                        Assess Yourself
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="./img/frame_person_mic.svg" alt="">
                                        Mock Interview
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="./img/school.svg" alt="">
                                        Upskill Yourself
                                    </a>

                                </div>
                            </div>
                            <div class="carousel-item">
                                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">

                                    <a href="#" class="action-link">
                                        <img src="./img/adaptive_audio_mic.svg" alt="">
                                        Counselling
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="./img/adaptive_audio_mic.svg" alt="">
                                        Work
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="./img/adaptive_audio_mic.svg" alt="">
                                        Jobs
                                    </a>

                                    <a href="#" class="action-link">
                                        <img src="./img/adaptive_audio_mic.svg" alt="">
                                        Companies
                                    </a>

                                </div>

                            </div>

                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>

                </div>


            </div>

        </div>

    </section>

    <!---------- Quick action end ------------->


    <!------------- top company hiring ------------>


    <section class="py-4 bg-light min-vh-100">

        <div class="container">

            <!-- Top Bar -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4" >

                <a href="#" class="back-link" data-aos="fade-right">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </a>

                <div class="d-flex gap-2">

                    <button class="edit-btn rounded-pill ">
                        <img src="./img/draft_orders.svg" alt="" width="24" height="24">
                        Edit
                    </button>

                    <button class=" download-btn   rounded-pill ">
                         <img src="./img/cloud_download1.svg" alt="" width="24" height="24">
                        Resume Download
                       
                    </button>

                </div>

            </div>

            <!-- Heading -->
            <h4 class="fw-bold mb-4" data-aos="fade-right">
                Your AI-Powered Resume is Ready!
            </h4>

            <!-- Templates -->
           

            <div class="col-12">
                <div class="img-box">
                    <img src="./img/image 61.png" alt="">
                </div>

            </div>

        </div>

    </section>

    <!------------- top company hiring end ------------>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>



</body>

</html>
